{% macro pkmCardL(pkm) %}
    <article class="displayCard bg-{{ pkm.types[0] }}">
    <div class="head">
      <div class="bg-img-{{ pkm.types[0] }}"></div>
      <h3 class=" bg-{{ pkm.types[0] }}">#{{ pkm.id }}</h3>
    </div>

    <div class="info">
      <figure>
        <img src="{{ pkm.sprites.front_default }}" alt="{{ pkm.name }}" />
        <figcaption>
          <span>height: {{ pkm.height }}</span>
          <span>weight: {{ pkm.weight }}</span>
        </figcaption>
      </figure>

      <h2>{{ pkm.name }}</h2>

      <div class="stats">
        {% for stat in pkm.stats %}
        <div>
          <h3>{{ stat.name }}</h3>
          <div class="statValue">{{ stat.value }}</div>
        </div>
        {% endfor %}
      </div>
    </div>

    <a href="/pkm/{{ pkm.id }}">Details</a>
  </article>
{% endmacro %}
